<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA Clinic Booking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F1EAE0;
    --surface: #FBF8F3;
    --surface-2: #ECE2D3;
    --border: #DDCDB4;
    --text: #2B2219;
    --text-muted: #80705D;
    --accent: #92622F;
    --accent-strong: #6F4A22;
    --accent-tint: #ECDCC2;
    --danger: #AA4A3A;
    --danger-tint: #F3E0DB;
    --warning: #A67A25;
    --warning-tint: #F1E3C4;
    --success: #4C6F45;
    --success-tint: #E2EADD;
    --shadow: none;
    --radius: 6px;
    --font-display: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mark: 'Cormorant', 'Noto Serif KR', Georgia, serif;
    --font-body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15110D;
      --surface: #1E1811;
      --surface-2: #261F15;
      --border: #3B301F;
      --text: #EFE6D8;
      --text-muted: #A8977E;
      --accent: #C08A4F;
      --accent-strong: #DBA86E;
      --accent-tint: #3A2C19;
      --danger: #D98977;
      --danger-tint: #3B2621;
      --warning: #D9AE63;
      --warning-tint: #39301A;
      --success: #8CAE82;
      --success-tint: #223422;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15110D;
    --surface: #1E1811;
    --surface-2: #261F15;
    --border: #3B301F;
    --text: #EFE6D8;
    --text-muted: #A8977E;
    --accent: #C08A4F;
    --accent-strong: #DBA86E;
    --accent-tint: #3A2C19;
    --danger: #D98977;
    --danger-tint: #3B2621;
    --warning: #D9AE63;
    --warning-tint: #39301A;
    --success: #8CAE82;
    --success-tint: #223422;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 64px; }

  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

  .shell { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }

  .hero { width: 100%; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; height: 168px; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero.placeholder { background: linear-gradient(135deg, var(--accent-tint), var(--surface-2)); display: flex; align-items: center; justify-content: center; }
  .hero.placeholder .ph-icon { font-family: var(--font-mark); font-size: 20px; color: var(--accent-strong); letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .brand .mark { font-size: 12.5px; color: var(--text-muted); }
  .brand h1 { font-size: 22px; color: var(--text); }
  .brand h1.wordmark { font-family: var(--font-mark); font-size: 26px; font-weight: 600; letter-spacing: 0.06em; color: var(--text); }
  .brand p { margin: 0; color: var(--text-muted); font-size: 14px; }
  .intro { display: flex; flex-direction: column; gap: 4px; }
  .intro h2 { font-size: 20px; font-weight: 700; }
  .intro p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.5; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); }
  .progress .meta b { color: var(--text); font-weight: 600; }
  .progress .bar { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .progress .bar span { display: block; height: 100%; background: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .card h2 { font-weight: 700; }

  .lang-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .lang-card { background: transparent; border: none; border-bottom: 1px solid var(--border); padding: 16px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: inherit; color: var(--text); text-align: left; }
  .lang-card:last-child { border-bottom: none; }
  .lang-card:hover { background: var(--surface-2); }
  .lang-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lang-card .native { font-size: 15.5px; font-weight: 600; }
  .lang-card .sub { font-size: 13px; color: var(--text-muted); flex: 1; }
  .lang-card .arrow { color: var(--text-muted); font-size: 18px; }

  label.field, div.field { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--text); font-weight: 500; }
  input[type="text"], input[type="date"], select {
    font-family: var(--font-body); font-size: 15px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 11px 12px; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; cursor: pointer; }
  .check-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
  .check-row .txt { font-size: 13.5px; color: var(--text); line-height: 1.4; }

  .radio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .radio-card { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font-family: inherit; text-align: left; color: var(--text); }
  .radio-card:hover { border-color: var(--accent); }
  .radio-card.selected { border-color: var(--accent); background: var(--accent-tint); }
  .radio-card .t { font-weight: 700; font-size: 14.5px; }
  .radio-card .s { font-size: 12px; color: var(--text-muted); }

  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { padding: 10px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 14px; font-variant-numeric: tabular-nums; cursor: pointer; text-align: center; }
  .slot:hover:not(:disabled) { border-color: var(--accent); }
  .slot.selected { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .slot:disabled { color: var(--text-muted); text-decoration: line-through; cursor: not-allowed; opacity: 0.6; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; }
  .cal-head button { background: none; border: none; font-size: 17px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 8px; font-family: inherit; }
  .cal-head button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .cal-head button:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-title { font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-wd { font-size: 11px; color: var(--text-muted); padding: 4px 0; font-weight: 600; }
  .cal-day { aspect-ratio: 1; width: 100%; max-width: 40px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 13.5px; font-variant-numeric: tabular-nums; cursor: pointer; background: transparent; border: 1px solid transparent; font-family: inherit; color: var(--text); }
  .cal-day:hover:not(.disabled):not(.empty) { background: var(--surface-2); border-color: var(--border); }
  .cal-day.selected { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.disabled { color: var(--text-muted); opacity: 0.35; cursor: not-allowed; }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-note { font-size: 12px; color: var(--text-muted); }

  .btn { font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 4px; padding: 13px 18px; border: 1px solid transparent; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn-row .btn { flex: 1; }
  .btn-row .btn-ghost { flex: 0 0 auto; min-width: 88px; }

  .banner { border-radius: 4px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; }
  .banner.error { background: var(--danger-tint); color: var(--danger); }
  .banner.warn { background: var(--warning-tint); color: var(--warning); }

  .summary { display: flex; flex-direction: column; gap: 0; }
  .summary-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--text-muted); }
  .summary-row .v { font-weight: 500; text-align: right; }

  .review-section { border-top: 2px solid var(--text); }
  .review-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px; font-size: 14px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border); }
  .review-head button { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; color: var(--text-muted); font-size: 12.5px; cursor: pointer; font-family: inherit; font-weight: 500; }
  .review-head button:hover { color: var(--text); border-color: var(--text-muted); }

  .confirm-icon { display: none; width: 52px; height: 52px; border-radius: 50%; background: var(--success-tint); color: var(--success); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto; }

  .site-foot { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 8px; font-size: 12.5px; color: var(--text-muted); line-height: 1.7; }
  .site-foot a { color: var(--text); text-decoration: none; font-weight: 600; }
  .site-foot a:hover { text-decoration: underline; }

  .consent { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid var(--border); }
  .consent details { font-size: 12.5px; color: var(--text-muted); padding-left: 26px; }
  .consent summary { cursor: pointer; text-decoration: underline; width: fit-content; }
  .consent ul { margin: 8px 0 0; padding: 10px 12px 10px 26px; background: var(--surface-2); border-radius: 4px; line-height: 1.6; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  @media (max-width: 520px) {
    #app { padding: 24px 16px 48px; }
    .card { padding: 20px 16px; }
    .brand { flex-direction: column; align-items: flex-start; gap: 2px; }
    .slot-grid { grid-template-columns: repeat(3, 1fr); }
    .radio-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  // Mon-Fri 10:00-21:00, Sat-Sun 10:00-19:00 (last 1-hour slot starts an hour before close).
  function getSlotsForDate(dateStr) {
    if (!dateStr) return [];
    var day = new Date(dateStr + 'T00:00:00').getDay(); // 0 Sun .. 6 Sat
    var isWeekend = (day === 0 || day === 6);
    var lastStartHour = isWeekend ? 18 : 20;
    var slots = [];
    for (var h = 10; h <= lastStartHour; h++) slots.push((h < 10 ? '0' + h : '' + h) + ':00');
    return slots;
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function monthTitle(lang, y, m) {
    if (lang === 'en') return MONTH_NAMES_EN[m] + ' ' + y;
    if (lang === 'ko') return y + '년 ' + (m + 1) + '월';
    return y + '年' + (m + 1) + '月';
  }

  function formatDateDisplay(lang, dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr + 'T00:00:00');
    var wd = WEEKDAYS[lang][d.getDay()];
    if (lang === 'en') return MONTH_NAMES_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' (' + wd + ')';
    return dateStr + ' (' + wd + ')';
  }

    return {

  function stepsHtml(current) {
    var tt = t();
    var items = [tt.stepVisit, tt.stepSchedule, tt.stepInfo, tt.stepConfirm];
    var pct = Math.round(current / items.length * 100);
    return '<div class="progress"><div class="meta"><b>' + esc(items[current - 1]) + '</b><span>' + current + ' / ' + items.length + '</span></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div></div>';
  }

  function renderLang() {
    var html = '';
    html += '<div class="shell">';
    html += heroHtml();
    html += '<div class="brand"><h1 class="wordmark">' + esc(T.ko.clinicName) + '</h1><div class="mark">' + esc(T.ko.clinicLocation) + '</div></div>';

    html += '<div class="lang-list">';
    LANGS.forEach(function (code) {
      var m = LANG_META[code];
      html += '<button class="lang-card" data-lang="' + code + '"><span class="native">' + m.native + '</span><span class="sub">' + (code === 'ko' ? '' : m.sub) + '</span><span class="arrow">&#8250;</span></button>';
    });
    html += '</div>';
    html += footHtml();
    html += '</div>';
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll('[data-lang]'), function (btn) {
      btn.addEventListener('click', function () {
        state.lang = btn.getAttribute('data-lang');
        state.form = freshForm();
        state.form.interpreter = state.lang !== 'ko';
        state.form.foreign = state.lang !== 'ko';
        state.form.channel = CHANNEL_DEFAULT[state.lang] || 'kakao';
        state.bookStep = 1;
        var now = new Date();
        state.calendar = { year: now.getFullYear(), month: now.getMonth() };
        state.view = 'book';
        render();
      });
    });
  }

  function subscribeDate(dateStr) {
    state.dateBooked = [];
    if (!SHEET_API_URL || !dateStr) return;
    var req = ++slotReq;
    fetch(SHEET_API_URL + '?action=slots&date=' + encodeURIComponent(dateStr))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (req !== slotReq || !res || !res.ok) return;
        state.dateBooked = res.booked || [];
        if (state.view === 'book' && state.bookStep === 2) render();
      })
      .catch(function () { /* slots just show as available; the sheet re-checks on submit */ });
  }

  function cardShell(stepNum, title, sub, bodyHtml, navHtml) {

    var html = '';
    html += '<div class="shell">';
    html += '<div class="brand"><h1 class="wordmark">' + esc(tt.clinicName) + '</h1><div class="mark">' + esc(tt.clinicLocation) + '</div></div>';
    html += stepsHtml(stepNum);
    html += '<div class="card">';
    html += '<div class="intro"><h2>' + esc(title) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
    if (dbState === 'unavailable') html += '<div class="banner warn">' + esc(tt.noDbError) + '</div>';
    if (state.error) html += '<div class="banner error">' + esc(state.error) + '</div>';
    html += bodyHtml;
    html += navHtml;
    html += '</div>';
    html += footHtml();
    html += '</div>';
    return html;
  }

  function renderBook() {
    if (state.bookStep === 1) return renderStepVisit();
    if (state.bookStep === 2) return renderStepSchedule();
    if (state.bookStep === 3) return renderStepInfo();
    return renderStepReview();
  }

  function goStep(n) {
    state.bookStep = n;
    state.error = '';
    render();
  }

  function renderStepVisit() {
    var tt = t();
    var f = state.form;
    var body = '<div class="radio-grid">';
    body += '<button type="button" class="radio-card' + (f.visitType === 'first' ? ' selected' : '') + '" data-visit="first"><span class="t">' + esc(tt.visitFirst) + '</span><span class="s">' + esc(tt.visitFirstSub) + '</span></button>';
    body += '<button type="button" class="radio-card' + (f.visitType === 'returning' ? ' selected' : '') + '" data-visit="returning"><span class="t">' + esc(tt.visitReturning) + '</span><span class="s">' + esc(tt.visitReturningSub) + '</span></button>';
    body += '</div>';
    var nav = '<div class="btn-row"><button class="btn btn-ghost" id="btn-back-lang">' + esc(tt.backBtn) + '</button><button class="btn btn-primary" id="btn-next">' + esc(tt.nextBtn) + '</button></div>';
    app.innerHTML = cardShell(1, tt.visitTitle, tt.visitSub, body, nav);

    Array.prototype.forEach.call(app.querySelectorAll('[data-visit]'), function (btn) {
      btn.addEventListener('click', function () { f.visitType = btn.getAttribute('data-visit'); render(); });
    });
    app.querySelector('#btn-back-lang').addEventListener('click', function () {
      state.view = 'lang'; state.lang = null; render();
    });
    app.querySelector('#btn-next').addEventListener('click', function () {
      if (!f.visitType) { state.error = tt.requiredError; render(); return; }
      goStep(2);
    });
  }

  function calendarHtml() {
    var tt = t();
    var lang = state.lang;
    var y = state.calendar.year, m = state.calendar.month;
    var firstWd = new Date(y, m, 1).getDay();
    var totalDays = new Date(y, m + 1, 0).getDate();
    var todayStr = todayISO();
    var atCurrentMonth = (y === todayParts.y && m === todayParts.m);
    var html = '<div>';
    html += '<div class="cal-head"><button type="button" id="cal-prev"' + (atCurrentMonth ? ' disabled' : '') + '>&#8249;</button><span class="cal-title">' + esc(monthTitle(lang, y, m)) + '</span><button type="button" id="cal-next">&#8250;</button></div>';
    html += '<div class="cal-grid">';
    WEEKDAYS[lang].forEach(function (w) { html += '<div class="cal-wd">' + esc(w) + '</div>'; });
    for (var i = 0; i < firstWd; i++) html += '<div class="cal-day empty"></div>';
    for (var d = 1; d <= totalDays; d++) {
      var ds = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var disabled = ds < todayStr;
      var selected = state.form.date === ds;
      html += '<button type="button" class="cal-day' + (disabled ? ' disabled' : '') + (selected ? ' selected' : '') + '" data-date="' + ds + '"' + (disabled ? ' disabled' : '') + '>' + d + '</button>';
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function renderStepSchedule() {
    var tt = t();
    var f = state.form;
    var body = '';
    body += '<label class="field">' + esc(tt.serviceLabel) + '<select id="f-service">';
    body += '<option value="">' + esc(tt.servicePh) + '</option>';
    SERVICE_KEYS.forEach(function (k) {
      body += '<option value="' + k + '"' + (f.service === k ? ' selected' : '') + '>' + esc(tt.services[k]) + '</option>';
    });
    body += '</select></label>';

    body += '<label class="field">' + esc(tt.doctorLabel) + '<input type="text" id="f-doctor" value="' + esc(f.doctor) + '" placeholder="' + esc(tt.doctorPh) + '">' + (tt.doctorHint ? '<span class="hint">' + esc(tt.doctorHint) + '</span>' : '') + '</label>';

    body += '<label class="field">' + esc(tt.companionLabel) + '<select id="f-companion">';
    body += '<option value="">' + esc(tt.companionPh) + '</option>';
    COMPANION_KEYS.forEach(function (k) {
      body += '<option value="' + k + '"' + (f.companion === k ? ' selected' : '') + '>' + esc(tt.companion[k]) + '</option>';
    });
    body += '</select></label>';

    body += '<div class="field">' + esc(tt.dateLabel) + calendarHtml() + '</div>';

    body += '<div class="field">' + esc(tt.timeLabel) + '<div class="hint" style="margin-bottom:2px;">' + esc(tt.timeHint) + '</div>';
    if (!f.date) {
      body += '<div class="hint">' + esc(tt.calPickFirst) + '</div>';
    } else {
      body += '<div class="slot-grid">';
      var nowHour = f.date === todayISO() ? new Date().getHours() : -1;
      getSlotsForDate(f.date).forEach(function (s) {
        var full = bookedCount(s) >= SLOT_CAPACITY || parseInt(s, 10) <= nowHour;
        var sel = f.time === s;
        body += '<button type="button" class="slot' + (sel ? ' selected' : '') + '" data-slot="' + s + '"' + (full ? ' disabled' : '') + '>' + s + (full ? '<br><small>' + esc(tt.slotFull) + '</small>' : '') + '</button>';
      });
      body += '</div>';
    }
    body += '</div>';

    var nav = '<div class="btn-row"><button class="btn btn-ghost" id="btn-back">' + esc(tt.backBtn) + '</button><button class="btn btn-primary" id="btn-next">' + esc(tt.nextBtn) + '</button></div>';
    app.innerHTML = cardShell(2, tt.scheduleTitle, tt.scheduleSub, body, nav);

    app.querySelector('#f-service').addEventListener('change', function (e) { f.service = e.target.value; });
    app.querySelector('#f-doctor').addEventListener('input', function (e) { f.doctor = e.target.value; });
    app.querySelector('#f-companion').addEventListener('change', function (e) { f.companion = e.target.value; });

    var prevBtn = app.querySelector('#cal-prev');
    if (prevBtn) prevBtn.addEventListener('click', function () {
      state.calendar.month--;
      if (state.calendar.month < 0) { state.calendar.month = 11; state.calendar.year--; }
      render();
    });
    app.querySelector('#cal-next').addEventListener('click', function () {
      state.calendar.month++;
      if (state.calendar.month > 11) { state.calendar.month = 0; state.calendar.year++; }
      render();
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-date]'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        f.date = btn.getAttribute('data-date');
        f.time = '';
        subscribeDate(f.date);
        render();
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-slot]'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        f.time = btn.getAttribute('data-slot');
        render();
      });
    });
    app.querySelector('#btn-back').addEventListener('click', function () { goStep(1); });
    app.querySelector('#btn-next').addEventListener('click', function () {
      if (!f.service || !f.companion || !f.date || !f.time) { state.error = tt.requiredError; render(); return; }
      goStep(3);
    });

  }

  function renderStepInfo() {
    var tt = t();
    var f = state.form;
    var body = '';

    body += '<label class="field">' + esc(tt.referralLabel) + '<select id="f-referral">';
    body += '<option value="">' + esc(tt.referralPh) + '</option>';
    REFERRAL_KEYS.forEach(function (k) {
      body += '<option value="' + k + '"' + (f.referral === k ? ' selected' : '') + '>' + esc(tt.referral[k]) + '</option>';
    });
    body += '</select></label>';

    body += '<label class="field">' + esc(tt.nameLabel) + '<input type="text" id="f-name" value="' + esc(f.name) + '" placeholder="' + esc(tt.namePh) + '"></label>';
    body += '<label class="field">' + esc(tt.birthLabel) + '<input type="text" id="f-birth" inputmode="numeric" maxlength="8" value="' + esc(f.birth) + '" placeholder="' + esc(tt.birthPh) + '"></label>';

    body += '<label class="field">' + esc(tt.genderLabel) + '<select id="f-gender">';
    body += '<option value="">' + esc(tt.genderPh) + '</option>';
    GENDER_KEYS.forEach(function (k) {
      body += '<option value="' + k + '"' + (f.gender === k ? ' selected' : '') + '>' + esc(tt.gender[k]) + '</option>';
    });
    body += '</select></label>';

    body += '<label class="field">' + esc(tt.contactLabel) + '<input type="text" id="f-contact" value="' + esc(f.contact) + '" placeholder="' + esc(tt.contactPh) + '"><span class="hint">' + esc(tt.contactHint) + '</span></label>';
    body += '<label class="field">' + esc(tt.nationalityLabel) + '<input type="text" id="f-nationality" value="' + esc(f.nationality) + '" placeholder="' + esc(tt.nationalityPh) + '"></label>';

    body += '<label class="check-row"><input type="checkbox" id="f-foreign" ' + (f.foreign ? 'checked' : '') + '><span class="txt">' + esc(tt.foreignCheck) + '</span></label>';
    if (f.foreign) {
      body += '<label class="field">' + esc(tt.passportLabel) + '<input type="text" id="f-passport" value="' + esc(f.passportNo) + '" placeholder="' + esc(tt.passportPh) + '"></label>';
    }

    body += '<label class="field">' + esc(tt.channelLabel) + (tt.channelHint ? '<span class="hint" style="margin-bottom:2px;">' + esc(tt.channelHint) + '</span>' : '') + '<select id="f-channel">';
    CHANNEL_KEYS.forEach(function (k) {
      body += '<option value="' + k + '"' + (f.channel === k ? ' selected' : '') + '>' + esc(tt.channel[k]) + '</option>';
    });
    body += '</select></label>';
    body += '<label class="check-row"><input type="checkbox" id="f-same" ' + (f.sameAsContact ? 'checked' : '') + '><span class="txt">' + esc(tt.sameAsContact) + '</span></label>';
    if (!f.sameAsContact) {
      body += '<label class="field">' + esc(tt.channelIdLabel) + '<input type="text" id="f-channelid" value="' + esc(f.channelId) + '" placeholder="' + esc(tt.channelIdPh) + '"></label>';
    }

    body += '<div class="consent">';
    body += '<label class="check-row"><input type="checkbox" id="f-consent" ' + (f.consent ? 'checked' : '') + '><span class="txt">' + esc(tt.consentCheck) + '</span></label>';
    body += '<details><summary>' + esc(tt.consentDetailLabel) + '</summary><ul>';
    tt.consentDetail.forEach(function (line) { body += '<li>' + esc(line) + '</li>'; });
    body += '</ul></details></div>';
    body += '<input type="text" id="f-website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" value="' + esc(f.website) + '">';

    var nav = '<div class="btn-row"><button class="btn btn-ghost" id="btn-back">' + esc(tt.backBtn) + '</button><button class="btn btn-primary" id="btn-next">' + esc(tt.nextBtn) + '</button></div>';
    app.innerHTML = cardShell(3, tt.infoTitle, tt.infoSub, body, nav);

    app.querySelector('#f-referral').addEventListener('change', function (e) { f.referral = e.target.value; });
    app.querySelector('#f-name').addEventListener('input', function (e) { f.name = e.target.value; });
    app.querySelector('#f-birth').addEventListener('input', function (e) { f.birth = e.target.value.replace(/[^0-9]/g, '').slice(0, 8); });
    app.querySelector('#f-gender').addEventListener('change', function (e) { f.gender = e.target.value; });
    app.querySelector('#f-contact').addEventListener('input', function (e) { f.contact = e.target.value; });
    app.querySelector('#f-nationality').addEventListener('input', function (e) { f.nationality = e.target.value; });
    app.querySelector('#f-foreign').addEventListener('change', function (e) { f.foreign = e.target.checked; render(); });
    var passportEl = app.querySelector('#f-passport');
    if (passportEl) passportEl.addEventListener('input', function (e) { f.passportNo = e.target.value; });
    app.querySelector('#f-channel').addEventListener('change', function (e) { f.channel = e.target.value; });
    app.querySelector('#f-same').addEventListener('change', function (e) { f.sameAsContact = e.target.checked; render(); });
    var channelIdEl = app.querySelector('#f-channelid');
    if (channelIdEl) channelIdEl.addEventListener('input', function (e) { f.channelId = e.target.value; });
    app.querySelector('#f-consent').addEventListener('change', function (e) { f.consent = e.target.checked; });
    app.querySelector('#f-website').addEventListener('input', function (e) { f.website = e.target.value; });

    app.querySelector('#btn-back').addEventListener('click', function () { goStep(2); });
    app.querySelector('#btn-next').addEventListener('click', function () {
      if (!f.referral || !f.name.trim() || !/^[0-9]{8}$/.test(f.birth) || !f.gender || !f.contact.trim() || !f.nationality.trim() || !f.channel) {
        state.error = /^[0-9]{8}$/.test(f.birth) || !f.birth ? tt.requiredError : tt.birthError;
        render();
        return;
      }
      if (!f.sameAsContact && !f.channelId.trim()) { state.error = tt.requiredError; render(); return; }
      if (!f.consent) { state.error = tt.consentError; render(); return; }
      goStep(4);
    });
  }

  function reviewRow(label, value, editStep) {
    return '<div class="summary-row"><span class="k">' + esc(label) + '</span><span class="v">' + esc(value) + '</span></div>';
  }

  function renderStepReview() {
    var tt = t();
    var f = state.form;
    var body = '';

    body += '<div class="review-section"><div class="review-head"><span>' + esc(tt.stepVisit) + ' / ' + esc(tt.stepSchedule) + '</span><button type="button" data-edit="2">' + esc(tt.editLabel) + '</button></div><div class="summary">';
    body += reviewRow(tt.reviewVisit, f.visitType === 'first' ? tt.visitFirst : tt.visitReturning);
    body += reviewRow(tt.reviewService, tt.services[f.service] || f.service);
    body += reviewRow(tt.reviewDoctor, f.doctor ? f.doctor : tt.none);
    body += reviewRow(tt.reviewCompanion, tt.companion[f.companion] || f.companion);
    body += reviewRow(tt.reviewDateTime, formatDateDisplay(state.lang, f.date) + ' ' + f.time);
    body += '</div></div>';

    body += '<div class="review-section"><div class="review-head"><span>' + esc(tt.stepInfo) + '</span><button type="button" data-edit="3">' + esc(tt.editLabel) + '</button></div><div class="summary">';
    body += reviewRow(tt.reviewReferral, tt.referral[f.referral] || f.referral);
    body += reviewRow(tt.reviewName, f.name);
    body += reviewRow(tt.reviewBirth, f.birth);
    body += reviewRow(tt.reviewGender, tt.gender[f.gender] || f.gender);
    body += reviewRow(tt.reviewContact, f.contact);
    body += reviewRow(tt.reviewNationality, f.nationality);
    body += reviewRow(tt.reviewForeign, f.foreign ? (tt.foreignCheck + (f.passportNo ? ' · ' + f.passportNo : '')) : tt.none);
    body += reviewRow(tt.reviewChannel, tt.channel[f.channel] + ' · ' + (f.sameAsContact ? f.contact : f.channelId));
    body += '</div></div>';

    var nav = '<div class="btn-row"><button class="btn btn-ghost" id="btn-back">' + esc(tt.backBtn) + '</button><button class="btn btn-primary" id="btn-submit"' + (state.submitting ? ' disabled' : '') + '>' + (state.submitting ? esc(tt.submitting) : esc(tt.finalSubmitBtn)) + '</button></div>';
    app.innerHTML = cardShell(4, tt.reviewTitle, tt.reviewSub, body, nav);

    Array.prototype.forEach.call(app.querySelectorAll('[data-edit]'), function (btn) {
      btn.addEventListener('click', function () { goStep(parseInt(btn.getAttribute('data-edit'), 10)); });
    });
    app.querySelector('#btn-back').addEventListener('click', function () { goStep(3); });
    app.querySelector('#btn-submit').addEventListener('click', submitBooking);
  }

  function submitBooking() {
    var tt = t();
    var f = state.form;
    var ko = T.ko;
    state.error = '';
    if (!SHEET_API_URL) {
      state.error = tt.noDbError;
      render();
      return;
    }
    state.submitting = true;
    render();

    // The sheet is read by Korean staff, so labels go in Korean regardless of the booking language.
    var payload = {
      date: f.date,
      time: f.time,
      name: f.name.trim(),
      contact: f.contact.trim(),
      service: ko.services[f.service] || f.service,
      doctor: (f.doctor || '').trim(),
      companions: ko.companion[f.companion] || f.companion,
      visitType: f.visitType === 'first' ? '초진' : '재진',
      referral: ko.referral[f.referral] || f.referral,
      birth: f.birth,
      gender: ko.gender[f.gender] || f.gender,
      nationality: f.nationality.trim(),
      interpreter: f.foreign ? '필요' : '',
      passportNo: f.foreign ? (f.passportNo || '').trim() : '',
      channel: ko.channel[f.channel] || f.channel,
      channelId: f.sameAsContact ? f.contact.trim() : f.channelId.trim(),
      language: (LANG_META[state.lang] || {}).native || state.lang,
      consent: !!f.consent,
      website: f.website
    };

    // text/plain keeps this a "simple" request, so Apps Script doesn't need a CORS preflight.
    fetch(SHEET_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        state.submitting = false;
        if (res && res.ok) {
          state.lastBooking = { id: res.id, name: payload.name, service: f.service, doctor: payload.doctor, date: f.date, time: f.time };
          state.view = 'confirm';
          render();
          return;
        }
        if (res && res.error === 'slot_taken') {
          state.error = tt.slotTakenError;
          f.time = '';
          subscribeDate(f.date);
          state.bookStep = 2;
        } else {
          state.error = tt.submitError;
        }
        render();
      })
      .catch(function () {
        state.submitting = false;
        state.error = tt.submitError;
        render();
      });
  }

  function renderConfirm() {
    var tt = t();
    var b = state.lastBooking || {};
    var html = '';
    html += '<div class="shell">';
    html += confirmHeroHtml();
    html += '<div class="brand"><h1 class="wordmark">' + esc(tt.clinicName) + '</h1><div class="mark">' + esc(tt.clinicLocation) + '</div></div>';
    html += '<div class="card">';
    html += '<div class="intro"><h2>' + esc(tt.confirmTitle) + '</h2><p>' + esc(tt.confirmSub) + '</p></div>';
    html += '<div class="summary review-section">';
    html += '<div class="summary-row"><span class="k">' + esc(tt.bookingIdLabel) + '</span><span class="v">' + esc(b.id || '') + '</span></div>';
    html += '<div class="summary-row"><span class="k">' + esc(tt.nameLabel) + '</span><span class="v">' + esc(b.name) + '</span></div>';
    html += '<div class="summary-row"><span class="k">' + esc(tt.serviceLabel) + '</span><span class="v">' + esc(tt.services[b.service] || b.service) + '</span></div>';
    html += '<div class="summary-row"><span class="k">' + esc(tt.reviewDoctor) + '</span><span class="v">' + esc(b.doctor || tt.none) + '</span></div>';
    html += '<div class="summary-row"><span class="k">' + esc(tt.reviewDateTime) + '</span><span class="v">' + esc(formatDateDisplay(state.lang, b.date)) + ' ' + esc(b.time) + '</span></div>';
    html += '<div class="summary-row"><span class="k">' + esc(tt.statusLabel) + '</span><span class="v">' + esc(tt.statusPending) + '</span></div>';
    html += '</div>';
    html += '<button class="btn btn-ghost" id="btn-new" style="width:100%;">' + esc(tt.newBookingBtn) + '</button>';
    html += '</div>';
    html += footHtml();
    html += '</div>';
    app.innerHTML = html;

    app.querySelector('#btn-new').addEventListener('click', function () {
      state.form = freshForm();
      state.lastBooking = null;
      state.bookStep = 1;
      state.view = 'lang';
      state.lang = null;
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
